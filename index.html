<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divine, apprendre le vin</title>
<meta property="og:title" content="Divine, apprendre le vin">
<meta property="og:description" content="Trois minutes par jour pour apprendre le vin. Un vin à trouver chaque jour, des défis entre amis.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#2A0F14;--ink:#F8EDE9;--dim:#C0A199;--gold:#E2B75A;--surface:#3A171D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 30%,#4A1C26,var(--bg) 70%);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
main{max-width:420px;text-align:center}
.k{font:800 12px ui-rounded,-apple-system,system-ui;letter-spacing:.16em;color:var(--gold)}
h1{font:800 30px/1.15 ui-rounded,-apple-system,system-ui;margin:10px 0 8px}
p{color:var(--dim);margin:0 0 18px}
.btn{display:block;background:var(--gold);color:#14100C;text-decoration:none;font:800 17px ui-rounded,-apple-system,system-ui;padding:15px;border-radius:14px;margin:10px 0}
.code{background:var(--surface);border-radius:14px;padding:12px;font:800 20px ui-rounded,system-ui;letter-spacing:.12em;margin:14px 0}
small{color:var(--dim);font-size:13px}
svg{width:110px;height:110px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 25Q53.1 15.7 59.3 12" stroke="#7A6430" stroke-width="3.1" fill="none" stroke-linecap="round"/><path d="M59.3 12Q71.7 -2.9 76.4 8.9Q69.2 20 59.3 12Z" fill="#5E9C6C"/><circle cx="50" cy="56" r="31" fill="#6E5AA8"/><path d="M44.6 54.8Q48 48.6 51.4 54.8M48.6 54.8Q52 48.6 55.4 54.8" stroke="#20102C" stroke-width="1.7" fill="none" stroke-linecap="round" transform="translate(-3 0)"/><path d="M44.4 61.6Q50 70.9 55.6 61.6Z" fill="#20102C"/></svg>
  <div class="k">DIVINE</div>
  <h1 id="t">Apprendre le vin, trois minutes par jour</h1>
  <p id="d">Un vin à trouver chaque jour, des leçons courtes, des défis entre amis.</p>
  <div id="c" class="code" hidden></div>
  <a class="btn" id="open" href="#">Ouvrir dans Divine</a>
  <small id="s">Pas encore l'app ? Divine arrive bientôt sur l'App Store, pour iPhone.</small>
</main>
<script>
// Ce lien s'ouvre ici quand l'app n'est pas installée (ou sur un ordinateur) :
// on dit ce qu'il contient, et comment le retrouver dans l'app.
const parts=location.pathname.split("/").filter(Boolean);
const kind=parts[0], v=(parts[1]||"").toUpperCase();
const T=document.getElementById("t"),D=document.getElementById("d"),C=document.getElementById("c");
if(kind==="i"&&v){T.textContent="On t'invite sur Divine";D.textContent="Un ami t'attend pour apprendre le vin ensemble. Une fois l'app installée, entre son code dans l'onglet Amis.";C.textContent=v;C.hidden=false;}
else if(kind==="d"&&v){T.textContent="On te défie";D.textContent="Les mêmes questions, à toi de faire mieux. Le défi s'ouvre dans l'app.";}
else if(kind==="v"){T.textContent="Le vin du jour n°"+(Number(parts[1]||0)+1);D.textContent="Un vin à trouver chaque jour, le même pour tous, en six essais.";}
document.getElementById("open").href="divine://"+(kind?kind+"/"+(parts[1]||""):"");
// Insécables avant : ? !
for(const el of document.querySelectorAll("h1,p,small")){el.textContent=el.textContent.replace(/ ([?!:;])/g," $1");}
</script>
</body>
</html>
